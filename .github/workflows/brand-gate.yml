name: brand-gate
# CI backstop for the local hooks in .githooks/: employer terms, AWS account ids and
# secrets in the changed lines, paths, commit messages and PR text. The local hooks are
# the real gate on a public repo (a pushed branch is already public); this job catches
# a clone where they were never installed.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  brand-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Employer terms and account ids in changes and commit messages
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: |
          case "$RANGE" in 0000000000000000000000000000000000000000..*) RANGE="${RANGE#*..}";; esac
          python3 scripts/brand-gate.py --range "$RANGE"
      - name: Employer terms in PR title and body
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | python3 scripts/brand-gate.py --text
      - name: Secrets (gitleaks 8.28.0, checksum-pinned)
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: |
          curl -sSfL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  gl.tgz" | sha256sum -c -
          tar xzf gl.tgz gitleaks
          case "$RANGE" in 0000000000000000000000000000000000000000..*) RANGE="${RANGE#*..}";; esac
          ./gitleaks git --log-opts="$RANGE" --redact --no-banner .
