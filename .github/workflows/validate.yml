name: validate-skills
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # F17 diffs against the base branch; a shallow clone cannot
          persist-credentials: false  # no later step pushes or fetches
      - name: Validate skills
        env:
          BASE_REF: origin/${{ github.base_ref || 'main' }}
        run: STRICT=0 bash scripts/validate-skills.sh
      - name: Prove the employer-term gate still catches its fixtures
        run: bash maintainers/scripts/prove-brand-gate.sh
      - name: Prove F20 still catches its fixtures
        run: bash maintainers/scripts/prove-f20.sh
